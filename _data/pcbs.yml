# Open-source keyboard PCBs these keycaps are made for. The designs belong
# to their authors; this site only links to them.

- id: amiga-mech
  name: Amiga Mechanical Keyboard
  machine: Amiga 2000 / 3000 / 4000
  author: Jason Beer
  url: https://github.com/jasonsbeer/Amiga-Mechanical-Keyboard
  summary: Cherry MX replacement keyboard for the big-box Amigas.

- id: a500kb
  name: A500KB
  machine: Amiga 500
  author: Henryk Richter
  url: https://github.com/HenrykRichter/A500KB
  summary: Custom mechanical keyboard for the Amiga 500.

- id: a600kbv2
  name: A600KBv2
  machine: Amiga 600
  author: Adam Eberbach
  url: https://github.com/aeberbach/A600KBv2
  summary: Low-profile mechanical keyboard for the Amiga 600.

- id: a1200kbv2
  name: A1200KBv2
  machine: Amiga 1200
  author: Adam Eberbach
  url: https://github.com/aeberbach/A1200KBv2
  summary: Mechanical A1200 keyboard with low-profile switches and a 3D-printed plate.

- id: a2000-cherry
  name: A2000 Cherry
  machine: Amiga 2000
  author: Graham Shaw
  url: https://github.com/grahamshaw1972/a2000Keyboard
  summary: Recreation of the original Amiga 2000 Cherry MX keyboard.

- id: eks-1000
  name: A1000 Keyboard
  machine: Amiga 1000
  author: Stephen Durham
  url: https://github.com/steveed/amiga-1000-keyboard-project
  summary: A new project to create an open A1000 keyboard PCB.
