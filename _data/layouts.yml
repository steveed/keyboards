# Keyboard Layout Editor layouts. Each one is a gist on github.com/steveed;
# `file` is a copy under assets/layouts/ so the site can draw it without
# calling the GitHub API (run `make layouts` to refresh the copies).

- id: amiga-iso-eu
  name: Amiga Standard (ISO / EU)
  gist: 4a565cbdb50d6d845cf8cc439113668d
  file: amiga-iso-eu.json
  notes: Full-size ISO set. The base for the A500, A1200 and (with the extras) A600 builds.

- id: amiga-600-extra-keys
  name: Amiga 600 extra keys
  gist: cec1138e6000deb5183f61fc0f1bb356
  file: amiga-600-extra-keys.json
  notes: The five narrower caps that turn the ISO set into an A600 set — 1.75u Shift, 1.25u Help, 1u Del, 1u Alt and an 8u spacebar.

