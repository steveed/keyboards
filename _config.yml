title: Retro Keyboards
tagline: Amiga keycaps, layouts and mechanical keyboard PCBs
author: Stephen Durham

# Served from the custom domain in CNAME (DNS: keyboards CNAME steveed.github.io,
# hosted at Rackspace Cloud DNS). The QR code on the business cards points here.
url: https://keyboards.stephendurham.com
baseurl: ""
# Shown under the QR code on the kiosk page; must match what the QR encodes.
display_url: keyboards.stephendurham.com

# Contact links shown in the header and footer. Leave blank to hide.
contact:
  amibay: https://www.amibay.com/members/steveed.32005/
  # The address is stored in two halves and joined by JavaScript in the
  # browser, so it never appears whole in the repo or the page source.
  email_user: keyboards
  email_domain: stephendurham.com
  github: https://github.com/steveed

markdown: kramdown
exclude:
  - README.md
  - Makefile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - scripts/
  - keyboard_pics/
  - pi/
  - vendor/
